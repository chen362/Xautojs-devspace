name: Desktop Release Artifacts

on:
  workflow_dispatch:
    inputs:
      desktop_version:
        description: Desktop version label used in artifact names.
        required: false
        default: 0.1.0
      release_channel:
        description: Artifact channel. Production signing remains disabled until secrets and updater policy are configured.
        required: true
        default: unsigned-smoke
        type: choice
        options:
          - unsigned-smoke
          - release-candidate

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event.inputs.desktop_version || github.run_id }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle_script: bundle:macos
            artifact_suffix: macos
          - name: Windows
            os: windows-latest
            bundle_script: bundle:windows
            artifact_suffix: windows
          - name: Linux
            os: ubuntu-latest
            bundle_script: bundle:linux
            artifact_suffix: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop install --no-package-lock

      - name: Check desktop package
        run: |
          npm run desktop:typecheck
          npm run desktop:test

      - name: Report signing mode
        shell: bash
        env:
          XAUTOJS_APPLE_CERTIFICATE: ${{ secrets.XAUTOJS_APPLE_CERTIFICATE }}
          XAUTOJS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.XAUTOJS_APPLE_CERTIFICATE_PASSWORD }}
          XAUTOJS_APPLE_SIGNING_IDENTITY: ${{ secrets.XAUTOJS_APPLE_SIGNING_IDENTITY }}
          XAUTOJS_APPLE_ID: ${{ secrets.XAUTOJS_APPLE_ID }}
          XAUTOJS_APPLE_PASSWORD: ${{ secrets.XAUTOJS_APPLE_PASSWORD }}
          XAUTOJS_APPLE_TEAM_ID: ${{ secrets.XAUTOJS_APPLE_TEAM_ID }}
          XAUTOJS_WINDOWS_CERTIFICATE: ${{ secrets.XAUTOJS_WINDOWS_CERTIFICATE }}
          XAUTOJS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.XAUTOJS_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          configured=0
          for name in \
            XAUTOJS_APPLE_CERTIFICATE \
            XAUTOJS_APPLE_CERTIFICATE_PASSWORD \
            XAUTOJS_APPLE_SIGNING_IDENTITY \
            XAUTOJS_APPLE_ID \
            XAUTOJS_APPLE_PASSWORD \
            XAUTOJS_APPLE_TEAM_ID \
            XAUTOJS_WINDOWS_CERTIFICATE \
            XAUTOJS_WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "Unsigned desktop artifact build. Configure signing secrets before production promotion."
          else
            echo "Signing placeholder secrets detected: $configured. Production signing still requires platform-specific Tauri signing config."
          fi

      - name: Bundle desktop artifacts
        env:
          XAUTOJS_DESKTOP_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: npm --prefix apps/desktop run ${{ matrix.bundle_script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xautojs-desktop-${{ matrix.artifact_suffix }}-${{ github.event.inputs.desktop_version || github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
