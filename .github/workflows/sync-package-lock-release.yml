name: Sync Package Lock Release Identity

# Rebuilds package-lock.json from package.json so CI's npm ci always installs
# the exact dependency graph declared by the repository.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - scripts/sync-package-lock-root.mjs
      - scripts/check-release-packaging.mjs
      - .github/workflows/sync-package-lock-release.yml

permissions:
  contents: write

concurrency:
  group: sync-package-lock-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-package-lock:
    name: Rebuild package-lock.json
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_FUND: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify release packaging metadata
        run: npm run release:check

      - name: Detect package-lock diff
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "package-lock.json was regenerated from package.json." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit package-lock update to main
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock with package.json"
          git push origin HEAD:main

      - name: Summary
        if: steps.diff.outputs.changed != 'true'
        run: echo "No package-lock update was required."
