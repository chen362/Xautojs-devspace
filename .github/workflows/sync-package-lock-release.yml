name: Sync Package Lock Release Identity

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch to sync from.
        required: true
        default: Xautojs-devspace
      work_branch:
        description: Branch that will receive the generated package-lock.json commit.
        required: true
        default: automation/package-lock-release-identity
      commit_message:
        description: Commit message for the generated package-lock.json update.
        required: true
        default: Fix package-lock release identity
  push:
    branches:
      - Xautojs-devspace
    paths:
      - package.json
      - package-lock.json
      - scripts/sync-package-lock-root.mjs
      - scripts/check-release-packaging.mjs
      - .github/workflows/sync-package-lock-release.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-package-lock-release-${{ github.event.inputs.base_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-package-lock:
    name: Sync package-lock root metadata
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.inputs.base_branch || github.ref_name }}
      WORK_BRANCH: ${{ github.event.inputs.work_branch || 'automation/package-lock-release-identity' }}
      COMMIT_MESSAGE: ${{ github.event.inputs.commit_message || 'Fix package-lock release identity' }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package-lock root metadata
        run: npm run release:sync-lockfile

      - name: Verify release packaging metadata
        run: npm run release:check

      - name: Detect package-lock diff
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already in sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "package-lock.json needs release identity sync:" >> "$GITHUB_STEP_SUMMARY"
            git diff -- package-lock.json | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit package-lock update
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$WORK_BRANCH"
          git add package-lock.json
          git commit -m "$COMMIT_MESSAGE"
          git push --force origin "HEAD:$WORK_BRANCH"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.BASE_BRANCH;
            const branch = process.env.WORK_BRANCH;
            const title = 'Fix package-lock release identity';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '## Summary',
              '',
              '- Sync `package-lock.json` top-level package metadata from `package.json`.',
              '- Ensure the release-facing lockfile identity is `xautojs-devspace` instead of the upstream package name.',
              '- Generated by the release lockfile sync workflow.',
              '',
              '## Verification',
              '',
              '- `npm run release:sync-lockfile`',
              '- `npm run release:check`',
              '',
              `Workflow run: ${runUrl}`,
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base,
            });

            if (existing.data.length > 0) {
              const pull = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                title,
                body,
              });
              core.summary.addRaw(`Updated PR #${pull.number}: ${pull.html_url}`).write();
            } else {
              const pull = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body,
                maintainer_can_modify: true,
              });
              core.summary.addRaw(`Created PR #${pull.data.number}: ${pull.data.html_url}`).write();
            }

      - name: Summary
        if: steps.diff.outputs.changed != 'true'
        run: echo "No package-lock release identity PR was needed."
