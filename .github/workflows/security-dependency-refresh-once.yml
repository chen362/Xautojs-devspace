name: One-shot Security Dependency Refresh

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/security-dependency-refresh-once.yml
  workflow_run:
    workflows:
      - Core CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    name: Refresh npm and Cargo lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Attempt Rust security refresh
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo update -p glib --precise 0.20.0
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "glib could not be refreshed independently; preserving the working Cargo graph."
            git checkout -- Cargo.lock
          fi
          exit 0

      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
          else
            git commit -m "security: refresh dependency lockfiles"
            git push origin HEAD:main
          fi

      - name: Verify refreshed lockfiles in a clean install
        run: |
          npm ci --ignore-scripts
          npm run release:check
          npm run typecheck
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit still reports high-severity production findings; Dependabot/upstream remediation may still be required."

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/security-dependency-refresh-once.yml
          git commit -m "ci: remove one-shot security refresh"
          git push origin HEAD:main
