name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
  DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
  DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

jobs:
  validate:
    name: Validate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Node 20
            os: ubuntu-latest
            node: 20
          - label: Ubuntu / Node 22
            os: ubuntu-latest
            node: 22
          - label: macOS / Node 22
            os: macos-latest
            node: 22
          - label: Windows / Node 22
            os: windows-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

      - name: Doctor JSON
        run: node dist/cli.js doctor --json

      - name: Release packaging metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run release:check

  postgres-integration:
    name: Postgres Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devspace
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: devspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devspace -d devspace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676
      DEVSPACE_DATABASE_PROVIDER: postgres
      DEVSPACE_DATABASE_URL: postgres://devspace:secret@127.0.0.1:5432/devspace_test
      DEVSPACE_POSTGRES_SSL_MODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Postgres peer dependency
        run: npm install --no-save --no-package-lock pg

      - name: Check Postgres configuration
        run: npx tsx src/cli.ts db status --json

      - name: Run Postgres integration tests
        run: npm run test:postgres
